name: Sync labels

# Creates or updates every label in .github/labels.json.
# Runs when that file changes on main, or by hand from the Actions tab.
on:
  push:
    branches: [main]
    paths:
      - .github/labels.json
      - .github/workflows/sync-labels.yml
  workflow_dispatch:
    inputs:
      delete-other-labels:
        description: Also delete labels that are not in labels.json (for example GitHub's defaults)
        type: boolean
        default: false

permissions:
  issues: write
  contents: read

jobs:
  sync:
    name: Sync labels
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        env:
          DELETE_OTHERS: ${{ inputs.delete-other-labels }}
        with:
          script: |
            const fs = require('fs');
            const wanted = JSON.parse(fs.readFileSync('.github/labels.json', 'utf8'));
            const existing = await github.paginate(github.rest.issues.listLabelsForRepo, {
              ...context.repo, per_page: 100,
            });
            const byName = new Map(existing.map(l => [l.name.toLowerCase(), l]));

            for (const label of wanted) {
              const color = label.color.replace('#', '');
              const current = byName.get(label.name.toLowerCase());
              if (!current) {
                await github.rest.issues.createLabel({ ...context.repo, ...label, color });
                core.info(`Created ${label.name}`);
              } else if (current.name !== label.name || current.color !== color ||
                         (current.description || '') !== (label.description || '')) {
                await github.rest.issues.updateLabel({
                  ...context.repo, name: current.name, new_name: label.name,
                  color, description: label.description,
                });
                core.info(`Updated ${label.name}`);
              }
            }

            if (process.env.DELETE_OTHERS === 'true') {
              const keep = new Set(wanted.map(l => l.name.toLowerCase()));
              for (const label of existing) {
                if (!keep.has(label.name.toLowerCase())) {
                  await github.rest.issues.deleteLabel({ ...context.repo, name: label.name });
                  core.info(`Deleted ${label.name}`);
                }
              }
            }
